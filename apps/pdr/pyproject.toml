[project]
name = "pdr"
version = "0.1.0"
description = "Extract telemetry from Cadillac PDR dashcam video by decoding the on-screen overlay"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.scripts]
pdr = "pdr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdr"]

[tool.hatch.build.targets.wheel.force-include]
"pdr/data" = "pdr/data"
